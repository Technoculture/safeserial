name: Build and Publish Node Bindings

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            arch: x64
            platform: win32
          # Linux x64
          - os: ubuntu-latest
            arch: x64
            platform: linux
          # Linux ARM64
          - os: ubuntu-latest
            arch: arm64
            platform: linux
          # macOS x64 (Intel)
          - os: macos-13
            arch: x64
            platform: darwin
          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            arch: arm64
            platform: darwin

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      
      - name: Setup ARM64 cross-compilation (Linux)
        if: matrix.platform == 'linux' && matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      
      - name: Build native addon
        working-directory: bindings/node
        run: |
          npm run prebuild
        env:
          npm_config_arch: ${{ matrix.arch }}
      
      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: bindings/node/prebuilds/

  publish:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: bindings/node/prebuilds/
          pattern: prebuild-*
          merge-multiple: true
      
      - name: Install dependencies
        working-directory: bindings/node
        run: npm ci --ignore-scripts
      
      - name: Build TypeScript
        working-directory: bindings/node
        run: npm run build:ts
      
      - name: List prebuilds
        run: ls -la bindings/node/prebuilds/
      
      - name: Publish to npm
        working-directory: bindings/node
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
